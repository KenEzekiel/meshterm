services:
  mesh-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: meshterm
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - mesh-data:/data
    environment:
      - MESH_OPERATOR_TOKEN=${MESH_OPERATOR_TOKEN:?MESH_OPERATOR_TOKEN must be set}
      - MESH_HOST=0.0.0.0
      - MESH_PORT=4200
      - MESH_DATABASE=/data/meshterm.sqlite

volumes:
  mesh-data:

# To connect to a TLS reverse proxy,
# create a docker-compose.override.yml:
#
#   services:
#     mesh-server:
#       networks:
#         - default
#         - npm_default
#   networks:
#     npm_default:
#       external: true
