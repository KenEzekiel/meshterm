name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: namespace-profile-ken

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Test CLI loads
        run: bun run packages/cli/index.ts --version

      - name: Test server starts
        run: |
          MESH_OPERATOR_TOKEN=ci-operator-token-with-at-least-32-characters \
            MESH_DATABASE=/tmp/meshterm-ci.sqlite \
            MESH_PORT=4200 \
            bun run packages/server/server.ts &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl -sf http://localhost:4200/readyz; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build container
        run: docker build -t "meshterm-ci:$GITHUB_SHA" -f docker/Dockerfile .

      - name: Test container starts
        run: |
          smoke_container="meshterm-image-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$smoke_container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$smoke_container" --network none \
            --tmpfs /data:mode=1777,size=16m \
            -e MESH_OPERATOR_TOKEN=ci-operator-token-with-at-least-32-characters \
            "meshterm-ci:$GITHUB_SHA"
          for attempt in {1..10}; do
            if docker exec "$smoke_container" wget -qO- http://127.0.0.1:4200/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$smoke_container"
          exit 1
